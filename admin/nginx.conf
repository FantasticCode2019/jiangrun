server {
    listen 3001;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500M;  # 支持大文件（图片/视频）分片上传

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API：大文件分片请求体可达 ~分片大小，允许大 body
    location /api/ {
        proxy_pass http://server:8080;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://server:8080;
    }
}
