name: jiangrun

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  storage-init:
    build:
      context: .
      dockerfile: storage.Dockerfile
    container_name: jiangrun-storage-init
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /uploads/images /uploads/videos /uploads/tmp && chown -R 10001:10001 /uploads && chmod 0750 /uploads /uploads/images /uploads/videos /uploads/tmp"]
    volumes:
      - uploads:/uploads
    restart: "no"
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    network_mode: none

  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: jiangrun-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填，请运行 ./deploy.sh init 生成 .env}
      POSTGRES_DB: ${POSTGRES_DB:-jiangrun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: jiangrun-server
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      - DATABASE_DBNAME=${POSTGRES_DB:-jiangrun}
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中配置随机 JWT_SECRET}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:?ADMIN_INITIAL_PASSWORD 必填，至少12位且包含字母和数字}
      - SERVER_MODE=${SERVER_MODE:-release}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://jiangrun.net,https://www.jiangrun.net}
    volumes:
      - uploads:/app/uploads
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/settings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 150
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://server:8080}
    container_name: jiangrun-frontend
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 150
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: jiangrun-admin
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,nosuid,nodev,uid=101,gid=101
      - /var/run:size=8m,nosuid,nodev,uid=101,gid=101
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: jiangrun-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR 必填，目录内须有 fullchain.pem 和 privkey.pem}:/etc/nginx/certs:ro
      - ./certbot:/var/www/certbot:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - frontend
      - admin
      - server
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,nosuid,nodev
      - /var/run:size=8m,nosuid,nodev
    logging: *default-logging
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
