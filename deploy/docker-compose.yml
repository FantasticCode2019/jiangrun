name: jiangrun

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: jiangrun-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填，请运行 ./deploy.sh init 生成 .env}
      POSTGRES_DB: ${POSTGRES_DB:-jiangrun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # Go 后端 API
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: jiangrun-server
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      - DATABASE_DBNAME=${POSTGRES_DB:-jiangrun}
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中配置随机 JWT_SECRET}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - SERVER_MODE=${SERVER_MODE:-release}
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/settings || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal
    # 后端不向宿主机公开端口（仅内部 + Nginx 反代），减少暴露面
    # ports:
    #   - "8080:8080"

  # 前台官网 (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://server:8080}
    container_name: jiangrun-frontend
    environment:
      - NODE_ENV=production
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # 后台管理 (React + Vite)
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
    container_name: jiangrun-admin
    # 后台管理：监听所有接口，供局域网/服务器外部访问。
    # 如需仅本机访问（更安全），改为: "127.0.0.1:3001:3001"
    ports:
      - "3001:3001"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  # Nginx 反向代理（对外唯一入口）
  nginx:
    image: nginx:alpine
    container_name: jiangrun-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - frontend
      - admin
      - server
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  uploads:
  logs: