name: jiangrun-dev

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?DEV_POSTGRES_PASSWORD 未配置，请运行 ./dev.sh init}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-jiangrun_dev}
    ports:
      # 开发数据库只允许本机访问，避免意外暴露到局域网或公网。
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata-dev:
