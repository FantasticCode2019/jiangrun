map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sensitive:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

server {
    listen 80;
    server_name jiangrun.net www.jiangrun.net;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jiangrun.net www.jiangrun.net;
    server_tokens off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    client_max_body_size 1m;
    limit_conn per_ip 30;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    location = /api/v1/login {
        client_max_body_size 16k;
        limit_req zone=sensitive burst=3 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location = /api/v1/contact {
        client_max_body_size 16k;
        limit_req zone=sensitive burst=5 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/v1/admin/upload/ {
		client_max_body_size 12m;
        limit_req zone=admin_api burst=20 nodelay;
		include /etc/nginx/proxy_params.conf;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://server:8080;
    }

    location ^~ /api/v1/admin/ {
        client_max_body_size 2m;
        limit_req zone=admin_api burst=15 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/ {
        client_max_body_size 1m;
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /uploads/ {
		root /usr/share/nginx;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition inline always;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        limit_req zone=public_api burst=40 nodelay;
        proxy_pass http://admin:3001/;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        limit_req zone=public_api burst=60 nodelay;
        proxy_pass http://frontend:3000;
        include /etc/nginx/proxy_params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
